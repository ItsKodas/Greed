# The game in one container, pointed at a database you already run.
#
#   docker compose up --build
#
# Then open http://localhost:3001 — in production the server serves the built
# client itself, so there is no separate web container and no CORS to arrange.
#
# MONGO_URL comes from .env. Two things to watch when filling it in:
#
#   * `localhost` inside a container means the container, not your machine.
#     To reach a mongod on this host, use host.docker.internal:27017.
#   * Leaving it unset is not an error. The game runs on an in-memory store:
#     profiles, chips and history vanish on restart, everything else works.
#
# To have this stack bring its own database instead, add the second file:
#
#   docker compose -f docker-compose.yml -f docker-compose.bundled-db.yml up --build

services:
  greed:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # Passed straight through from .env. Only the bundled-db file overrides it.
      MONGO_URL: ${MONGO_URL:-}
      # These two do override .env, because inside the container the only
      # sensible answer is the container's own: the server serves the client,
      # so the origin is its own port.
      CLIENT_ORIGIN: http://localhost:3001
      PORT: "3001"
    env_file:
      - path: .env
        required: false
