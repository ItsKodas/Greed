name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # The MongoStore tests skip themselves without this, and a test that
      # always skips is a test that does not exist. Everything else runs
      # against MemoryStore and does not touch it.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The workspace packages export TypeScript source, so a clean install is
      # all the setup there is — nothing needs building before the checks run.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          MONGO_TEST_URL: mongodb://localhost:27017/greed-test

      # Proves the client still builds and the sound files still get copied,
      # which is the step the Docker image depends on.
      - name: Build
        run: npm run build

  # The image is how this actually ships, so a broken Dockerfile is a broken
  # release. Building it here catches that at the commit rather than at deploy.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
